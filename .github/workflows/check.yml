name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make check
      - run: go test -race ./...
      - run: make version
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...

  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm install --global npm@12.2.1
      - run: npm ci
        working-directory: gui
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: make gui-check
      - run: make gui-build
      - name: Audit dependencies without exceptions
        run: |
          npm audit --registry=https://registry.npmjs.org --json > "$RUNNER_TEMP/npm-audit.json" || test "$?" -eq 1
          python3 ../scripts/check_npm_audit.py "$RUNNER_TEMP/npm-audit.json" package-lock.json
        working-directory: gui

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make tools-check docs-check
