aula: "SMX2C 2026-27"
version: 2

# Valores comunes. Los hosts de cada alumno los heredan si no los redefinen.
comun:
  hosts:
    host1:
      puerto: 22
      usuario: "usuario"
      password_ref: "${AULA_PASSWORD}"     # referencia, nunca el valor
  timeouts:
    conexion: 10s
    alumno: 10m

alumnos:
