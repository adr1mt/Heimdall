# Demostración local: alumnado ficticio, sin SSH ni comandos.
exam: "Prueba sencilla · 15 alumnos"
version: 1
hosts: []
defaults: { weight: 1 }
groups:
  - group: "Cinco preguntas de redes"
    checks:
      - id: p1
        description: "Puerto de HTTPS"
        value: "${student.p1}"
        equals: "443"
      - id: p2
        description: "Puerto de SSH"
        value: "${student.p2}"
        equals: "22"
      - id: p3
        description: "Puerto de DNS"
        value: "${student.p3}"
        equals: "53"
      - id: p4
        description: "Protocolo que reparte direcciones IP"
        value: "${student.p4}"
        equals: "DHCP"
      - id: p5
        description: "Dirección de bucle local"
        value: "${student.p5}"
        equals: "127.0.0.1"
