# E1 de docs/design/01-TRADUCCION-EXAMENES.md: el cuestionario de redes.
#
# Las respuestas del alumno están en aula.yaml y la comprobación las lee de
# allí: no hay comando, ni en la máquina del alumno ni en la del profesor. El
# examen original ejecutaba diez `echo` con los datos del alumno dentro de una
# cadena de shell en el equipo del profesor.
exam: "Cuestionario de redes"
version: 1
hosts: []

defaults:
  weight: 1

groups:
  - group: "Cuestionario de redes"
    checks:
      - id: p1
        description: "Puerto por defecto de HTTPS"
        value: "${student.p1}"
        equals: "443"

      - id: p2
        description: "Puerto por defecto de SSH"
        value: "${student.p2}"
        equals: "22"

      - id: p3
        description: "Máscara /24 en decimal"
        value: "${student.p3}"
        equals: "255.255.255.0"

      - id: p4
        description: "Protocolo que reparte direcciones automáticamente"
        value: "${student.p4}"
        equals: "DHCP"

      - id: p5
        description: "Puerto por defecto de DNS"
        value: "${student.p5}"
        equals: "53"

      - id: p6
        description: "Dirección de bucle local"
        value: "${student.p6}"
        equals: "127.0.0.1"

      - id: p7
        description: "Número de hosts útiles en una /30"
        value: "${student.p7}"
        equals: "2"

      - id: p8
        description: "Registro DNS que asocia un nombre a una IPv4"
        value: "${student.p8}"
        equals: "A"

      - id: p9
        description: "Rango privado de clase A"
        weight: 2
        value: "${student.p9}"
        equals: "10.0.0.0/8"

      - id: p10
        description: "Comando que muestra la tabla de rutas"
        value: "${student.p10}"
        contains: "ip route"
