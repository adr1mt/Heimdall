# Examen RA2 del curso, traducido del original de Teuton
# (docs/design/01-TRADUCCION-EXAMENES.md). Son las mismas 16 comprobaciones,
# con el mismo peso, sin tuberías y sin depender del idioma del sistema.
exam: "Examen RA2 · Servicios de red (KEA + BIND)"
version: 3
hosts: [host1]

defaults:
  weight: 1
  timeout: 20s

groups:
  - group: "Red"
    checks:
      - id: netplan
        description: "El servidor tiene 10.0.0.1/8 en enp2s0"
        on: host1
        cmd: ["ip", "address", "show", "dev", "enp2s0"]
        contains: "10.0.0.1/8"

  - group: "KEA"
    checks:
      - id: kea-red
        description: "KEA declara la subred 10.0.0.0/8"
        on: host1
        cmd: ["cat", "/etc/kea/kea-dhcp4.conf"]
        near: { anchor: '"subnet"', lines: 5, contains: "10.0.0.0/8" }

      - id: kea-tarjeta
        description: "KEA sirve por la tarjeta enp2s0"
        on: host1
        cmd: ["cat", "/etc/kea/kea-dhcp4.conf"]
        contains: "enp2s0"

      - id: kea-puerta-enlace
        description: "KEA reparte 10.0.0.1 como puerta de enlace"
        on: host1
        cmd: ["cat", "/etc/kea/kea-dhcp4.conf"]
        near: { anchor: '"name": "routers"', lines: 5, contains: "10.0.0.1" }

      - id: kea-dns
        description: "KEA reparte 10.0.0.1 como servidor DNS"
        on: host1
        cmd: ["cat", "/etc/kea/kea-dhcp4.conf"]
        near: { anchor: '"name": "domain-name-servers"', lines: 5, contains: "10.0.0.1" }

  - group: "DNS"
    checks:
      - id: dns-forwarder
        description: "Reenviador 9.9.9.9 configurado"
        on: host1
        cmd: ["cat", "/etc/bind/named.conf.options"]
        near: { anchor: "forwarders", lines: 5, contains: "9.9.9.9" }

      - id: dns-red-trabajo
        description: "La red 10.0.0.0/8 está autorizada en las opciones"
        on: host1
        cmd: ["cat", "/etc/bind/named.conf.options"]
        contains: "10.0.0.0/8;"

      - id: dns-zonas
        description: "La zona inversa 10.in-addr.arpa está declarada"
        on: host1
        cmd: ["cat", "/etc/bind/named.conf.local"]
        contains: "10.in-addr.arpa"

      - id: dns-pc1
        description: "pc1 resuelve a 10.1.1.100 en la zona directa"
        on: host1
        cmd: ["cat", "/etc/bind/forward.examen.local"]
        near: { anchor: "pc1", lines: 0, contains: "10.1.1.100" }

      - id: dns-servidorweb
        description: "servidorweb resuelve a 10.2.0.1 en la zona directa"
        on: host1
        cmd: ["cat", "/etc/bind/forward.examen.local"]
        near: { anchor: "servidorweb", lines: 0, contains: "10.2.0.1" }

      - id: dns-alias
        description: "blog es un alias de pc1.examen.local"
        on: host1
        cmd: ["cat", "/etc/bind/forward.examen.local"]
        near: { anchor: "blog", lines: 0, contains: "pc1.examen.local" }

      - id: dns-texto
        description: "La zona directa tiene un registro TXT con «hola»"
        on: host1
        cmd: ["cat", "/etc/bind/forward.examen.local"]
        near: { anchor: "TXT", lines: 3, contains: "hola" }

      - id: dns-inversa-servidor
        description: "La zona inversa resuelve 10.0.0.1"
        on: host1
        cmd: ["cat", "/etc/bind/reverse.examen.local"]
        contains: "1.0.0"

      - id: dns-inversa-pc1
        description: "La zona inversa resuelve 10.1.1.100"
        on: host1
        cmd: ["cat", "/etc/bind/reverse.examen.local"]
        contains: "100.1.1"

      - id: dns-inversa-servidorweb
        description: "La zona inversa resuelve 10.2.0.1"
        on: host1
        cmd: ["cat", "/etc/bind/reverse.examen.local"]
        contains: "1.0.2"

      - id: dns-activo
        description: "El servicio named está activo"
        on: host1
        cmd: ["systemctl", "is-active", "named"]
        equals: "active"
