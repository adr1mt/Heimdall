# Examen de la sesión de examen (T063, ADR-0020). Todo lo que pide lo cumple
# la máquina del laboratorio: sirve para que un alumno llegue al examen entero
# y la vuelta siguiente lo deje fuera.
exam: "Sesión de examen"
version: 1
hosts: [host1]
defaults: { weight: 1, timeout: 20s }
groups:
  - group: "Base"
    checks:
      - id: s1-hostname
        description: "El host responde y se identifica"
        on: host1
        cmd: ["hostname"]
        contains: "alu"
      - id: s2-fichero
        description: "Existe /etc/os-release"
        on: host1
        weight: 2
        cmd: ["test", "-f", "/etc/os-release"]
        exit_code: 0
