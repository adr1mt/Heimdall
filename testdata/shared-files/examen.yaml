examen: "Lecturas compartidas · Kea"
version: 1
hosts: [servidor]
por_defecto: { peso: 1, timeout: 20s }
grupos:
  - grupo: "Configuración Kea (texto)"
    comprobaciones:
      - id: kea-01
        descripcion: "La configuración contiene Dhcp4"
        en: servidor
        fichero: "/etc/kea/kea-dhcp4.conf"
        contiene: "Dhcp4"
      - id: kea-02
        descripcion: "La configuración contiene interfaces-config"
        en: servidor
        fichero: "/etc/kea/kea-dhcp4.conf"
