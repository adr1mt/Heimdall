# Examen con una clave que no existe, para el criterio A-13: un YAML mal
# escrito no llega a tocar ninguna máquina.
exam: "Clave desconocida"
version: 1
hosts: [host1]
defaults: { weight: 1, timeout: 20s }
groups:
  - group: "Base"
    checks:
      - id: a13-clave
        description: "Una comprobación con una clave inventada"
        on: host1
        cmd: ["hostname"]
        contains: "alu"
        comprobar_que: "inventado"
