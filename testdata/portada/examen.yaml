# Examen de la captura del README. Corre contra el contenedor de test/lab.sh,
# así que las comprobaciones son las que esa máquina puede contestar de
# verdad: nada inventado, nada dibujado a mano.
#
# La clase que lo acompaña la escribe gui/scripts/lab-flow.ts con CLASS_SIZE,
# y su último alumno apunta a un puerto cerrado: la captura tiene que enseñar
# también qué pasa con una máquina que no responde.
exam: "Servicios básicos"
version: 1
hosts: [host1]
defaults: { weight: 1, timeout: 20s }
groups:
  - group: "La máquina"
    checks:
      - id: hostname
        description: "La máquina se identifica"
        on: host1
        cmd: ["hostname"]
        contains: "alu"
      - id: usuario
        description: "La cuenta del alumno existe"
        on: host1
        cmd: ["id", "-un"]
        equals: "${student.user}"
      - id: sistema
        description: "El sistema es el que se pidió"
        on: host1
        weight: 2
        cmd: ["test", "-f", "/etc/os-release"]
        exit_code: 0
  - group: "Servicio web"
    checks:
      - id: web-instalado
        description: "El servidor web está instalado"
        on: host1
        cmd: ["test", "-x", "/usr/sbin/nginx"]
        exit_code: 0
      - id: web-raiz
        description: "La raíz del sitio existe"
        on: host1
        cmd: ["test", "-d", "/var/www/html"]
        exit_code: 0
  - group: "SSH"
    checks:
      - id: ssh-activo
        description: "El servidor SSH está escuchando"
        on: host1
        cmd: ["test", "-d", "/etc/ssh"]
        exit_code: 0
      - id: ssh-sin-root
        description: "No se entra como root por SSH"
        on: host1
        weight: 2
        cmd: ["grep", "-c", "PermitRootLogin no", "/etc/ssh/sshd_config"]
        exit_code: 0
