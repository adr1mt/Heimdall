# Encaminament: només ip_forward guardat a sysctl. Sense NAT ni comprovació del valor actiu.
exam: RA1 v2
version: 1
hosts:
- host1
defaults:
  weight: 1
  timeout: 20s
  sudo: true
groups:
- group: Xarxa
  checks:
  - id: net-externa-netplan
    description: Configuració de la xarxa externa
    on: host1
    checker:
    - ra1-dhcp
    - cc653e10b6087ad31ce72344a361f53599376188cfef6aea560d67f2fb8f9811
    - net-externa-netplan
    - ${student.if_ext}
    - ${student.if_int}
    - ${host1.ip}
    equals: OK
    weight: 1
  - id: net-externa-gw
    description: Porta d’enllaç del servidor
    on: host1
    checker:
    - ra1-dhcp
    - cc653e10b6087ad31ce72344a361f53599376188cfef6aea560d67f2fb8f9811
    - net-externa-gw
    - ${student.if_ext}
    - ${student.if_int}
    - ${host1.ip}
    equals: OK
    weight: 1
  - id: net-externa-dns
    description: DNS del servidor
    on: host1
    checker:
    - ra1-dhcp
    - cc653e10b6087ad31ce72344a361f53599376188cfef6aea560d67f2fb8f9811
    - net-externa-dns
    - ${student.if_ext}
    - ${student.if_int}
    - ${host1.ip}
    equals: OK
    weight: 1
  - id: net-interna-netplan
    description: Configuració de la xarxa interna
    on: host1
    checker:
    - ra1-dhcp
    - cc653e10b6087ad31ce72344a361f53599376188cfef6aea560d67f2fb8f9811
    - net-interna-netplan
    - ${student.if_ext}
    - ${student.if_int}
    - ${host1.ip}
    equals: OK
    weight: 1
- group: Kea
  checks:
  - id: kea-interficie
    description: Interfície del servei DHCP
    on: host1
    checker:
    - ra1-dhcp
    - cc653e10b6087ad31ce72344a361f53599376188cfef6aea560d67f2fb8f9811
    - kea-interficie
    - ${student.if_ext}
    - ${student.if_int}
    - ${host1.ip}
    equals: OK
    weight: 2
  - id: kea-subxarxa
    description: Subxarxa del servei DHCP
    on: host1
    checker:
    - ra1-dhcp
    - cc653e10b6087ad31ce72344a361f53599376188cfef6aea560d67f2fb8f9811
    - kea-subxarxa
    - ${student.if_ext}
    - ${student.if_int}
    - ${host1.ip}
    equals: OK
    weight: 2
  - id: kea-rang-final
    description: Rang d’assignació dinàmica
    on: host1
    weight: 2
    checker:
    - ra1-dhcp
    - cc653e10b6087ad31ce72344a361f53599376188cfef6aea560d67f2fb8f9811
    - kea-rang-final
    - ${student.if_ext}
    - ${student.if_int}
    - ${host1.ip}
    equals: OK
  - id: kea-porta-enllac
    description: Porta d’enllaç dels clients
    on: host1
    checker:
    - ra1-dhcp
    - cc653e10b6087ad31ce72344a361f53599376188cfef6aea560d67f2fb8f9811
    - kea-porta-enllac
    - ${student.if_ext}
    - ${student.if_int}
    - ${host1.ip}
    equals: OK
    weight: 2
  - id: kea-dns
    description: DNS dels clients
    on: host1
    checker:
    - ra1-dhcp
    - cc653e10b6087ad31ce72344a361f53599376188cfef6aea560d67f2fb8f9811
    - kea-dns
    - ${student.if_ext}
    - ${student.if_int}
    - ${host1.ip}
    equals: OK
    weight: 2
  - id: kea-reserves
    description: Reserves d’adreces
    on: host1
    checker:
    - ra1-dhcp
    - cc653e10b6087ad31ce72344a361f53599376188cfef6aea560d67f2fb8f9811
    - kea-reserves
    - ${student.if_ext}
    - ${student.if_int}
    - ${host1.ip}
    equals: OK
    weight: 2
  - id: kea-actiu
    description: Estat del servei DHCP
    on: host1
    weight: 2
    checker:
    - ra1-dhcp
    - cc653e10b6087ad31ce72344a361f53599376188cfef6aea560d67f2fb8f9811
    - kea-actiu
    - ${student.if_ext}
    - ${student.if_int}
    - ${host1.ip}
    equals: OK
- group: Encaminament
  checks:
  - id: fwd-persistent
    description: Configuració de l’encaminament IPv4
    on: host1
    checker:
    - ra1-dhcp
    - cc653e10b6087ad31ce72344a361f53599376188cfef6aea560d67f2fb8f9811
    - fwd-persistent
    - ${student.if_ext}
    - ${student.if_int}
    - ${host1.ip}
    equals: OK
    weight: 1
