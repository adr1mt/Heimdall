    - 7a3b55fdd7e9a43a25d22948f5cf52da4202bacd07420816a2e25de6e46d8dd9
    - net-externa-ip
    - ${alumno.if_ext}
    - ${alumno.if_int}
    - ${host1.ip}
    igual_a: OK
