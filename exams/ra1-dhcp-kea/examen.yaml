# Encaminament: només ip_forward actiu. Sense comprovacions de NAT ni nftables.
# Comprobador fijo y versionado. Véase README.md.
examen: 0227 · RA1 · DHCP amb Kea per a 250 equips
version: 1
hosts:
- host1
por_defecto:
  peso: 1
  timeout: 20s
  sudo: true
